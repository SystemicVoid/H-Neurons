interface:
  display_name: "CodeRabbit Review"
  short_description: "AI-powered code review via the CodeRabbit CLI (wraps `coderabbit review --agent`)."
  default_prompt: "$coderabbit-review"

policy:
  # Repo-local override for unattended /goal runs in this project. The global
  # CodeRabbit skill remains explicit-only, but this repo requires independent
  # review validation to use the local helper/policy when the goal calls for it.
  allow_implicit_invocation: true
