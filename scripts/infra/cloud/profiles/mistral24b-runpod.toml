name = "mistral24b-runpod"
provider = "runpod"
description = "Mistral-Small-24B CP1/CP2 RunPod Secure Cloud A100-default profile."

[git]
bundle_branch = "main"

[runpod]
pod_name = "hneurons-mistral24b"
cloud_type = "SECURE"
# Private template `h-neurons-runpod-private`; update it after each image bake.
template_id = "v88hqzvuxk"
expected_image_repository = "ghcr.io/systemicvoid/h-neurons-runpod"
expected_image_digest = "sha256:15c9114da2420086a83ff85f261d07427e60ffd62835a177e587c3f2e431508e"
# Use the runpodctl gpuId value here, not the display name from GPU listings.
gpu_id = "NVIDIA A100-SXM4-80GB"
gpu_count = 1
container_disk_gb = 120
volume_gb = 100
volume_mount_path = "/workspace"
ports = "8888/http,22/tcp"
data_center_ids = ["US-MD-1", "US-MO-1", "US-WA-1", "EUR-IS-1"]
ssh = true
global_networking = false
public_ip = false

[storage]
first_cp1_mode = "ephemeral"
network_volume_size_gb = 200

[mistral]
model_key = "mistral_small_24b_instruct_2501"
model_path = "mistralai/Mistral-Small-24B-Instruct-2501"
device_map = "cuda:0"
wrapper = "scripts/infra/mistral24b_replication.sh"
required_hardware = "A100/H100-class CUDA GPU, BF16 support, >=75 GiB VRAM"
