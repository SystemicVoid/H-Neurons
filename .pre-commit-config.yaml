repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=10240']

  - repo: local
    hooks:
      - id: active-run-git-guard
        name: active run Git guard
        entry: uv run python -m scripts.lib.pipeline check-active-run-git-guard
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-check
        name: ruff check
        entry: ruff check --force-exclude
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: ruff format --check --force-exclude
        language: system
        types: [python]

      - id: ty-check
        name: ty check
        entry: ty check --force-exclude
        language: system
        files: ^(scripts|tests)/.*\.py$

      - id: ci-audit
        name: CI coverage audit
        entry: uv run python scripts/audit_ci_coverage.py
        language: system
        pass_filenames: false
